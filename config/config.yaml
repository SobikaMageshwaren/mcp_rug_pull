# TrustGuard-MCP Configuration File

system:
  name: "TrustGuard-MCP"
  version: "1.0.0"
  environment: "research_prototype"
  random_seed: 42

llm:
  provider: "mock"  # Options: mock, openai, anthropic, ollama
  model: "gpt-4o-mini"
  temperature: 0.1
  max_tokens: 1000

embedding:
  model_name: "all-MiniLM-L6-v2"
  dimension: 384
  use_gpu: false

trust:
  initial_score: 100.0
  threshold_safe: 80.0
  threshold_suspicious: 50.0
  threshold_block: 30.0
  weight_config_path: "config/trust_weights.yaml"
  decay_rate: 0.15
  recovery_rate: 0.02

anomaly_detection:
  algorithm: "IsolationForest"  # Options: IsolationForest, OneClassSVM, LocalOutlierFactor
  n_estimators: 100
  contamination: 0.15
  random_state: 42

rag:
  vector_db: "faiss"
  top_k: 3
  similarity_threshold: 0.30
  knowledge_base_path: "data/processed/threat_intel_kb.json"

evaluation:
  test_size: 0.3
  temporal_split_ratio: 0.7
  ablation_runs: 5

notifications:
  maintenance_email: "sobikamageshwaren@gmail.com"
  alert_channels: ["email", "soc_console", "stix_gateway"]
  auto_dispatch_severity: ["CRITICAL", "HIGH", "SUSPICIOUS", "REQUIRE_HUMAN_APPROVAL", "MONITOR"]
  smtp_relay_host: "smtp.trustguard-mcp.internal"
  smtp_relay_port: 587

